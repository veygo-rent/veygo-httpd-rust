name: Build & Deploy API

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: rust:slim-bookworm
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git pkg-config libssl-dev libpq-dev libsodium-dev ca-certificates
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/veygo-httpd-rust dist/api
          chmod +x dist/api

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-binary
          path: dist/api
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host:
          - "35.208.20.204"
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: api-binary
          path: dist

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ matrix.host }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship binary and restart
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ matrix.host }}
        run: |
          chmod +x dist/api

          SERVER_PATH=$(ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$HOST" \
            '. /etc/veygo/deploy.env && printf "%s" "$SERVER_PATH"')
          echo "Deploying to $SERVER_PATH on $HOST"

          scp -i ~/.ssh/id_ed25519 dist/api \
            "$SSH_USER@$HOST:$SERVER_PATH/bin/api.new"

          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$HOST" \
            ". /etc/veygo/deploy.env && cd \"\$SERVER_PATH\" && \
             chmod +x bin/api.new && \
             ( [ -e bin/api ] && cp bin/api bin/api.prev || true ) && \
             mv bin/api.new bin/api && \
             sudo docker compose -f main-server-docker-compose.yml restart api"

      - name: Verify container is running
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ matrix.host }}
        run: |
          ok=""
          for i in $(seq 1 10); do
            state=$(ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$HOST" \
              'sudo docker inspect -f "{{.State.Running}} {{.State.Restarting}}" server-api' || true)
            echo "attempt $i -> $state"
            if [ "$state" = "true false" ]; then ok=1; sleep 3; 
              state2=$(ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$HOST" \
                'sudo docker inspect -f "{{.State.Running}} {{.State.Restarting}}" server-api' || true)
              [ "$state2" = "true false" ] && break || ok=""
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::server-api not stably running, rolling back."
            ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$HOST" \
              ". /etc/veygo/deploy.env && cd \"\$SERVER_PATH\" && \
              ( [ -e bin/api.prev ] && mv bin/api.prev bin/api || true ) && \
              sudo docker compose -f main-server-docker-compose.yml restart api"
          exit 1
          fi
          echo "Deploy healthy (container running)."
